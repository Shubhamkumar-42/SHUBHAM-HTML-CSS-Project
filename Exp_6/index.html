<!DOCTYPE html>
<html>
<head>
    <title>Centered Form</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        form {
            border: 1px solid black;
            padding: 20px;
            width: 400px;
        }

        button {
            padding: 5px 15px;
        }
    </style>
</head>
<body>

<h2>Student Registration Form</h2>

<form id="myForm">

    Name: <input type="text" id="name" required><br><br>

    Email: <input type="email" id="email" required><br><br>

    Password: <input type="password" id="password" required><br><br>

    Age: <input type="number" id="age"><br><br>

    Date of Birth: <input type="date" id="dob"><br><br>

    Gender:
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <br><br>

    Hobbies:
    <input type="checkbox" name="hobby" value="Reading"> Reading
    <input type="checkbox" name="hobby" value="Sports"> Sports
    <input type="checkbox" name="hobby" value="Music"> Music
    <br><br>

    Course:
    <select id="course">
        <option value="B.Tech">B.Tech</option>
        <option value="BCA">BCA</option>
        <option value="MCA">MCA</option>
    </select>
    <br><br>

    Address:<br>
    <textarea id="address"></textarea>
    <br><br>

    <button type="button" onclick="printData()">Submit</button>

</form>

<script>
function printData() {

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let age = document.getElementById("age").value;
    let dob = document.getElementById("dob").value;
    let course = document.getElementById("course").value;
    let address = document.getElementById("address").value;

    let gender = document.querySelector('input[name="gender"]:checked');
    gender = gender ? gender.value : "";

    let hobbies = document.querySelectorAll('input[name="hobby"]:checked');
    let hobbyList = "";
    hobbies.forEach(function(hobby) {
        hobbyList += hobby.value + " ";
    });

    // For now just console output (since table removed)
    console.log({
        name, email, password, age, dob,
        gender, hobbyList, course, address
    });

    alert("Data submitted successfully!");
}
</script>

</body>
</html>
