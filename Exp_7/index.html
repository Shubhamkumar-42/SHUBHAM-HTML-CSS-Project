<!DOCTYPE html>
<html>
<head>
    <title>Form Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Student Registration Form</h2>

<form id="myForm">

    Name: <input type="text" id="name" required><br><br>
    Email: <input type="email" id="email" required><br><br>
    Password: <input type="password" id="password" required><br><br>
    Age: <input type="number" id="age"><br><br>
    DOB: <input type="date" id="dob"><br><br>

    Gender:
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <br><br>

    Hobbies:
    <input type="checkbox" name="hobby" value="Reading"> Reading
    <input type="checkbox" name="hobby" value="Sports"> Sports
    <input type="checkbox" name="hobby" value="Music"> Music
    <br><br>

    Course:
    <select id="course">
        <option>B.Tech</option>
        <option>BCA</option>
        <option>MCA</option>
    </select>
    <br><br>

    Address:<br>
    <textarea id="address"></textarea><br><br>

    <button type="button" onclick="saveData()">Submit</button>

</form>

<script src="script.js"></script>
</body>
</html>
